# docker-compose.prod.yml — homelab deployment (public demo stack)
# Uses .env.prod on the host for secrets and paths. Never commit .env.prod.
# Start:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Update: docker compose -f docker-compose.prod.yml --env-file .env.prod pull app && \
#         docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Note: --env-file is required for Compose to resolve ${VAR} in image/volume paths.
#       env_file: below only injects vars into the running container, not the YAML parser.
#
# Public ingress is a Cloudflare Tunnel (cloudflared → app:3000). Nothing else is
# published to the internet; Prometheus/Grafana are reached via the host's ports
# (Tailscale-only access). Ollama is reachable only on the internal network — never
# expose it directly (ADR 0001).

services:
  app:
    image: ${ECR_REGISTRY}/resumeloop:${IMAGE_TAG:-latest}
    ports:
      - "3010:3000"
    env_file:
      - .env.prod
    environment:
      # Container-to-container Ollama (overrides the localhost default)
      DEMO_OLLAMA_BASE_URL: ${DEMO_OLLAMA_BASE_URL:-http://ollama:11434/v1}
    volumes:
      # JD source files (read + write — scan tags JDs as resume-ed)
      - ${OBSIDIAN_JOBS_PATH}:/jobs
      # DOCX output
      - ${OUTPUT_PATH}:/output
      # SQLite DB — persists across image updates
      - ${DB_PATH:-./resume.db}:/app/resume.db
      # Pipeline data — edits via /config page persist to host
      - ${PIPELINE_DATA_PATH:-./pipeline/master_resume_data.json}:/app/pipeline/master_resume_data.json
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal, edge]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Keep in agreement with DEMO_MAX_CONCURRENT_INFERENCE (app-level semaphore)
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      # Keep the demo model warm between requests — cold loads are expensive on CPU
      OLLAMA_KEEP_ALIVE: "30m"
      # Demo JDs are capped at 20k chars (~5-6k tokens); tune after the on-box benchmark
      OLLAMA_CONTEXT_LENGTH: "4096"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Internal only — never on the edge network, never a published port
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
    networks: [edge]

  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    networks: [internal]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Create on the host: echo -n "$METRICS_TOKEN" > infra/prometheus/metrics-token
      - ./infra/prometheus/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks: [internal]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/resumeloop-dashboard.json:/var/lib/grafana/dashboards/resumeloop.json:ro
    restart: unless-stopped
    networks: [internal]

networks:
  # app + cloudflared — the only path public traffic takes
  edge: {}
  # app + ollama + monitoring — no public ingress
  internal: {}

volumes:
  ollama_models: {}
  prometheus_data: {}
  grafana_data: {}
