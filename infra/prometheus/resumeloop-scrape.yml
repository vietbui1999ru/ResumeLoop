# Drop this into an EXISTING external Prometheus's scrape_configs (e.g. a separate
# homelab monitoring box scraping over Tailscale). The self-hosted demo stack in
# docker-compose.prod.yml runs its own Prometheus using infra/prometheus/prometheus.yml
# instead — this fragment is only for scraping from outside the compose network.
#
# Prerequisites:
#   1. Set METRICS_TOKEN in .env.prod (any random string, keep it secret)
#   2. Add the same token below
#
#   METRICS_TOKEN=<generate with: openssl rand -hex 32>

- job_name: resumeloop
  metrics_path: /api/metrics/prometheus
  scrape_interval: 60s
  scrape_timeout: 15s

  authorization:
    type: Bearer
    credentials: REPLACE_WITH_YOUR_METRICS_TOKEN

  static_configs:
    - targets:
        # Host port published by docker-compose.prod.yml (app 3000 → host 3010)
        - <tailscale-hostname>:3010
      labels:
        env: demo
        app: resumeloop
